<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="css/a5.css">
        <script src="js/a5.js" defer></script>
        <title>GitHub Developer Finder</title>
    </head>

    <body>

        <header>
            <h1>GitHub Developer Finder</h1>
            <a href="a5-indexeddb.html">Developer Registry (IndexedDB)</a>
        </header>

        <main>

            <!-- Task 1e: search by username -->
            <section>
                <h2>Search a GitHub user</h2>
                <div class="search">
                <input id="searchInput" type="text">
                <button id="searchBtn">Search</button>
                </div>
                <div id="searchStatus" class="error"></div>
            </section>

            <!-- Tasks 1b and 1c: highlighted developers -->
            <section>
                <h2>Highlighted Github Developers</h2>
                <div id="status"></div>
                <div id="cards"></div>
            </section>

        </main>

        <!-- Task 1d: detail pop-up (hidden until opened) -->
        <div id="overlay">
            <div id="modal">
                <button id="closeBtn">X</button>
                <div id="modalBody"></div>
            </div>
        </div>
    </body>
</html>
