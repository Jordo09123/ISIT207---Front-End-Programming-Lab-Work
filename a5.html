<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>GitHub Developer Finder</title>

        <style>
        * { box-sizing: border-box; }

        body {
            font-family: system-ui, Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
            color: #222;
        }

        /* ---------- header ---------- */
        header {
            background: #24292f;
            color: #fff;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        header h1 { margin: 0; font-size: 1.4rem; }
        header a  { color: #9ecbff; }

        /* ---------- layout ---------- */
        main { max-width: 1000px; margin: 0 auto; padding: 24px 16px; }
        section { margin-bottom: 32px; }
        h2 { margin-top: 0; }

        /* ---------- search (Task 1e) ---------- */
        .search { display: flex; gap: 8px; }
        .search input {
            flex: 1;
            padding: 10px;
            font-size: 1rem;
            border: 1px solid #bbb;
            border-radius: 6px;
        }

        button {
            padding: 10px 16px;
            font-size: 1rem;
            border: 0;
            border-radius: 6px;
            background: #2da44e;
            color: #fff;
            cursor: pointer;
        }
        button:hover { background: #2c974b; }

        /* ---------- messages ---------- */
        #status { margin: 8px 0; min-height: 1.2em; color: #555; }
        .error  { color: #c62828; }
        .null   { color: #999; font-style: italic; }

        /* ---------- cards (Task 1b) ---------- */
        #cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }
        .card {
            background: #fff;
            border-radius: 10px;
            padding: 16px;
            box-shadow: 0 1px 4px rgba(0,0,0,.15);
        }
        .card img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: block;
            margin-bottom: 8px;
        }
        .card p { margin: 4px 0; word-break: break-all; }

        /* clickable username (Task 1d) */
        .username {
            background: none;
            color: #0969da;
            padding: 0;
            font-size: 1.15rem;
            font-weight: bold;
            text-decoration: underline;
        }
        .username:hover { background: none; color: #0550ae; }

        /* ---------- pop-up (Task 1d) ---------- */
        #overlay {
            display: none;                
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.55);
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        #overlay.open { display: flex; }

        #modal {
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            max-width: 460px;
            width: 100%;
            max-height: 90vh;
            overflow: auto;
            position: relative;
        }
        #modal img { width: 110px; height: 110px; border-radius: 50%; }
        #modal p   { margin: 6px 0; word-break: break-word; }

        #closeBtn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #888;
            padding: 4px 10px;
        }
        </style>
    </head>

    <body>

        <header>
            <h1>GitHub Developer Finder</h1>
            <a href="a5-indexeddb.html">Developer Registry (IndexedDB)</a>
        </header>

        <main>

            <!-- Task 1e: search by username -->
            <section>
                <h2>Search a GitHub user</h2>
                <div class="search">
                <input id="searchInput" type="text">
                <button id="searchBtn">Search</button>
                </div>
                <div id="searchStatus" class="error"></div>
            </section>

            <!-- Tasks 1b and 1c: highlighted developers -->
            <section>
                <h2>Highlighted Github Developers</h2>
                <div id="status"></div>
                <div id="cards"></div>
            </section>

        </main>

        <!-- Task 1d: detail pop-up (hidden until opened) -->
        <div id="overlay">
            <div id="modal">
                <button id="closeBtn">X</button>
                <div id="modalBody"></div>
            </div>
        </div>

        <script>
            // github api personal access token goes here so more requests can be made per hour otherwise its only 60 per hour
            const HEADERS = { Authorization: "YOUR_TOKEN_HERE" };
            const USERS_URL = "https://api.github.com/users?per_page=100";
            const cache = new Map();
            let allUsers = [];         

            // Task 1a read all users from github and cache into a localstorage

            async function fetchAllUsers() {
                const saved = localStorage.getItem("usersList");
                if (saved) return JSON.parse(saved);

                const res = await fetch(USERS_URL, { headers: HEADERS });
                const data = await res.json();
                localStorage.setItem("usersList", JSON.stringify(data));
                return data;
            }

            // fetch full user profile 
            async function getUser(url) {
                if (cache.has(url)) return cache.get(url);

                const res = await fetch(url, { headers: HEADERS });
                const data = await res.json();
                cache.set(url, data);
                return data;
            }

            // Task 1b pick six random users and show them in cards

            function pickSix() {
                const shuffled = [...allUsers].sort(() => 0.5 - Math.random());
                return shuffled.slice(0, 6);
            }

            function cardHTML(user) {
                return `
                    <div class="card">
                        <img src="${user.avatar_url}" alt="Avatar of ${user.login}">
                        <p><button class="username" data-url="${user.url}">${user.login}</button></p>
                        <p>Blog: ${user.blog || "NULL"}</p>
                        <p>Location: ${user.location || "NULL"}</p>
                        <p>Site Admin: ${user.site_admin}</p>
                    </div>
                `;
            }

            async function loadSix() {
            const picked = pickSix();
            const profiles = await Promise.all(picked.map(u => getUser(u.url)));
            document.getElementById("cards").innerHTML = profiles.map(cardHTML).join("");
            }


            // task 1b and 1d profile to be shown on main page with details and to be able to click and close on profile for popup

            async function openProfile(url) {
                const overlay = document.getElementById("overlay");
                const body = document.getElementById("modalBody");

                body.innerHTML = "<p>Loading...</p>";
                overlay.classList.add("open");

                const user = await getUser(url);
                body.innerHTML = `
                    <img src="${user.avatar_url}" alt="Avatar of ${user.login}">
                    <h2>${user.login}</h2>
                    <p><strong>Name:</strong> ${user.name || "NULL"}</p>
                    <p><strong>Bio:</strong> ${user.bio || "NULL"}</p>
                    <p><strong>Homepage:</strong> ${user.blog || "NULL"}</p>
                    <p><strong>Location:</strong> ${user.location || "NULL"}</p>
                    <p><strong>Site admin:</strong> ${user.site_admin}</p>
                    <p><strong>Public repos:</strong> ${user.public_repos}</p>
                    <p><strong>Followers:</strong> ${user.followers}
                        &nbsp; <strong>Following:</strong> ${user.following}</p>
                    <p><strong>Member since:</strong> ${user.created_at ? user.created_at.slice(0, 10) : "NULL"}</p>
                    <p><a href="${user.html_url}" target="_blank" rel="noopener">Open GitHub profile</a></p>`;
            }

            function closeProfile() {
                document.getElementById("overlay").classList.remove("open");
            }

            // task 1c load six users every 20 seconds
            
            (async () => {
                allUsers = await fetchAllUsers();
                await loadSix();
                setInterval(loadSix, 20000);
            })();



            // task 1e user look up

            async function searchUser() {
                const input = document.getElementById("searchInput");
                const status = document.getElementById("searchStatus");
                const username = input.value.trim();
                status.textContent = "";

                if (!username) {
                    status.textContent = "Please enter a username.";
                    return;
                }

                const url = "https://api.github.com/users/" + encodeURIComponent(username);
                
                try {
                    await getUser(url);     // throws if the user doesn't exist
                    openProfile(url);       // same pop-up as 1d
                } catch (err) {
                    status.textContent = err.message;
                }
            }

            // event listeners for each function

            document.getElementById("searchBtn").addEventListener("click", searchUser);
            document.getElementById("searchInput").addEventListener("keypress", (e) => {
                if (e.key === "Enter") searchUser();
            });

            document.getElementById("cards").addEventListener("click", e => {
                const btn = e.target.closest(".username");
                if (btn) openProfile(btn.dataset.url);
            });

            document.getElementById("closeBtn").addEventListener("click", closeProfile);

            document.getElementById("overlay").addEventListener("click", e => {
                if (e.target.id === "overlay") closeProfile();
            });

            document.addEventListener("keydown", e => {
                if (e.key === "Escape") closeProfile();
            });

        </script>
    </body>
</html>
